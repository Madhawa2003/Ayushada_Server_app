<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ayushadha Pharmacy - Stock Management</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #134e5e, #71b280);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .main-container {
            max-width: 900px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        h2 {
            color: #134e5e;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            border-color: #134e5e;
            outline: none;
            box-shadow: 0 0 5px rgba(19, 78, 94, 0.3);
        }
        button {
            background: linear-gradient(135deg, #134e5e, #71b280);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        button:hover {
            opacity: 0.9;
        }
        #responseMsg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        /* Table styles for GET / DELETE */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #134e5e;
            color: white;
        }
        .delete-btn {
            background: #c62828;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- ADD STOCK SECTION (POST) -->
    <div class="container">
        <h2>💊 Ayushadha Pharmacy - Add Stock</h2>
        <form id="stockForm">
            <div class="form-group">
                <label for="batchNumber">Batch Number:</label>
                <input type="text" id="batchNumber" placeholder="Enter batch number" required>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" placeholder="Enter quantity" required>
            </div>
            <div class="form-group">
                <label for="mfgDate">Manufacturing Date:</label>
                <input type="date" id="mfgDate" required>
            </div>
            <div class="form-group">
                <label for="expDate">Expiry Date:</label>
                <input type="date" id="expDate" required>
            </div>
            <div class="form-group">
                <label for="note">Note:</label>
                <textarea id="note" rows="3" placeholder="Enter any notes"></textarea>
            </div>
            <div class="form-group">
                <label for="medicineId">Medicine ID:</label>
                <input type="number" id="medicineId" value="1" required>
            </div>
            <div class="form-group">
                <label for="supplierId">Supplier ID:</label>
                <input type="number" id="supplierId" value="1" required>
            </div>
            <button type="submit">Save Stock Batch</button>
        </form>
        <div id="responseMsg"></div>
    </div>

    <!-- VIEW & DELETE STOCK SECTION (GET & DELETE) -->
    <div class="container">
        <h2>📋 Stock Batches List</h2>
        <button onclick="loadBatches()" style="margin-bottom: 15px; background: #134e5e;">Refresh Stock List</button>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Batch Number</th>
                <th>Quantity</th>
                <th>Mfg Date</th>
                <th>Exp Date</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="stockTableBody">
            <!-- Data will load here dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. POST Request (Add Stock)
    document.getElementById('stockForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const stockData = {
            batchNumber: document.getElementById('batchNumber').value,
            quantity: parseInt(document.getElementById('quantity').value),
            mfgDate: document.getElementById('mfgDate').value,
            expDate: document.getElementById('expDate').value,
            note: document.getElementById('note').value,
            medicine: { id: parseInt(document.getElementById('medicineId').value) },
            supplier: { id: parseInt(document.getElementById('supplierId').value) }
        };

        try {
            const response = await fetch('http://localhost:8080/api/v1/inventory/batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(stockData)
            });

            const msgDiv = document.getElementById('responseMsg');
            if (response.ok) {
                msgDiv.style.color = '#2e7d32';
                msgDiv.textContent = 'Stock successfully added!';
                document.getElementById('stockForm').reset();
                loadBatches(); // Automatically reload the table
            } else {
                msgDiv.style.color = '#c62828';
                msgDiv.textContent = 'Failed to add stock!';
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('responseMsg').style.color = '#c62828';
            document.getElementById('responseMsg').textContent = 'Server connection error!';
        }
    });

    // 2. GET Request (View All Batches)
    async function loadBatches() {
        try {
            const response = await fetch('http://localhost:8080/api/v1/inventory/batches');
            const batches = await response.json();

            const tbody = document.getElementById('stockTableBody');
            tbody.innerHTML = '';

            batches.forEach(stock => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${stock.id}</td>
                    <td>${stock.batchNumber}</td>
                    <td>${stock.quantity}</td>
                    <td>${stock.mfgDate}</td>
                    <td>${stock.expDate}</td>
                    <td><button class="delete-btn" onclick="deleteBatch(${stock.id})">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error loading batches:', error);
        }
    }

    // 3. DELETE Request (Delete Batch by ID)
    async function deleteBatch(id) {
        if (!confirm('Are you sure you want to delete this batch?')) return;

        try {
            const response = await fetch(`http://localhost:8080/api/v1/inventory/batch/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert('Stock deleted successfully!');
                loadBatches(); // Refresh table after deletion
            } else {
                alert('Failed to delete stock.');
            }
        } catch (error) {
            console.error('Error deleting batch:', error);
        }
    }

    // Load table data automatically when page opens
    window.onload = loadBatches;
</script>

</body>
</html>
